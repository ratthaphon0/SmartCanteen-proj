version: "3.9"

# Production overrides — use with:
# docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  cv-engine:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    restart: always
    ports: []  # No direct access in prod, nginx handles routing
    environment:
      - UVICORN_WORKERS=4
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    restart: always
    ports: []  # nginx handles

  notification:
    restart: always
    deploy:
      replicas: 2

  postgres:
    restart: always

  redis:
    restart: always

  nginx:
    restart: always
    ports:
      - "80:80"
      - "443:443"
